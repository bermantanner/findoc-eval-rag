services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-findoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findoc}
      POSTGRES_DB: ${POSTGRES_DB:-findoc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findoc}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://findoc:findoc@db:5432/findoc
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
